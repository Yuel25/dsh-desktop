name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable version tag, for example v1.2.2'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Validate tag format
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'Only stable version tags such as v1.2.2 are supported.'
          }

      - name: Check out exact release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Validate version and extract release notes
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -cne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match package.json version $version."
          }
          $notes = Get-Content RELEASE_NOTES.md -Raw
          $heading = [regex]::Escape("# dsh-desktop $env:RELEASE_TAG")
          $section = [regex]::Match($notes, "(?ms)^$heading\r?\n(.*?)(?=^# |\z)")
          if (-not $section.Success -or [string]::IsNullOrWhiteSpace($section.Groups[1].Value)) {
            throw "Missing release notes for $env:RELEASE_TAG."
          }
          $section.Groups[1].Value.Trim() | Set-Content "$env:RUNNER_TEMP/release-notes.md" -Encoding utf8

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types, tests, and production build
        run: pnpm run check

      - name: Package Windows x64 installer without publishing
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --win nsis --x64 --publish never

      - name: Validate artifacts and create checksums
        run: |
          $installers = @(Get-ChildItem release -File -Filter '*.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer.' }
          $blockmaps = @(Get-ChildItem release -File -Filter '*.blockmap')
          if ($blockmaps.Count -ne 1) { throw 'Expected exactly one installer blockmap.' }
          $artifacts = @($installers) + @($blockmaps)
          if (Test-Path release/latest.yml) { $artifacts += Get-Item release/latest.yml }
          $artifacts | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt -Encoding utf8

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Refuse to change an existing public release. An incomplete draft can be retried.
          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) {
              throw "Release $env:RELEASE_TAG is already published; it will not be overwritten."
            }
          } else {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title "dsh-desktop $env:RELEASE_TAG" --notes-file "$env:RUNNER_TEMP/release-notes.md"
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create release draft.' }
          }
          $artifacts = @(Get-ChildItem release -File | Where-Object {
            $_.Extension -in '.exe', '.blockmap' -or $_.Name -in 'latest.yml', 'SHA256SUMS.txt'
          } | ForEach-Object { $_.FullName })
          gh release upload $env:RELEASE_TAG @artifacts --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Artifact upload failed; release remains a draft.' }
          gh release edit $env:RELEASE_TAG --notes-file "$env:RUNNER_TEMP/release-notes.md" --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish release draft.' }
